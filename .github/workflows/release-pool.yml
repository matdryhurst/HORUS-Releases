name: Release Pool macOS

run-name: Release Pool ${{ inputs.version }} from ${{ inputs.source_ref }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from desktop/version.py, without a leading v
        required: true
        type: string
      source_ref:
        description: Pool branch, tag, or commit already reachable from main
        required: true
        default: main
        type: string
      confirm_release:
        description: Publish this signed update to every Pool installation
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: pool-production-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      inputs.confirm_release &&
      (github.actor == 'matdryhurst' || github.actor == 'jordanmeyer')
    runs-on: macos-15
    timeout-minutes: 120
    environment: pool-production
    env:
      POOL_NOTARY_PROFILE: pool-ci-notary
      REQUESTED_VERSION: ${{ inputs.version }}

    steps:
      - name: Create read-only Pool source token
        id: pool-source-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.POOL_SOURCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.POOL_SOURCE_APP_PRIVATE_KEY }}
          owner: HerndonDryhurstStudio
          repositories: Pool
          permission-contents: read

      - name: Check out private Pool source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HerndonDryhurstStudio/Pool
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          path: pool
          persist-credentials: false
          token: ${{ steps.pool-source-token.outputs.token }}

      - name: Validate release request
        working-directory: pool
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          actual_version="$(python3 - <<'PY'
          from desktop.version import APP_VERSION
          print(APP_VERSION)
          PY
          )"
          if [[ "$REQUESTED_VERSION" != "$actual_version" ]]; then
            echo "Requested $REQUESTED_VERSION but source declares $actual_version." >&2
            exit 1
          fi
          test -f "desktop/releases/$REQUESTED_VERSION.md"
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "The selected source is not reachable from Pool main." >&2
            exit 1
          fi
          echo "POOL_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          if gh release view "v$REQUESTED_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$REQUESTED_VERSION already exists." >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check protected credentials
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          POOL_SPARKLE_PRIVATE_KEY: ${{ secrets.POOL_SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          required=(
            APPLE_DEVELOPER_ID_P12_BASE64
            APPLE_DEVELOPER_ID_P12_PASSWORD
            APPLE_NOTARY_KEY_P8_BASE64
            APPLE_NOTARY_KEY_ID
            APPLE_NOTARY_ISSUER_ID
            POOL_SPARKLE_PRIVATE_KEY
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing pool-production secret: $name" >&2
              exit 1
            fi
          done

      - name: Prepare Developer ID and notarization
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/pool-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          certificate="$RUNNER_TEMP/pool-developer-id.p12"
          notary_key="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"

          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 -D > "$certificate"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 -D > "$notary_key"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security default-keychain -d user -s "$keychain"

          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk '/Developer ID Application/ {print $2; exit}')"
          if [[ -z "$identity" ]]; then
            echo "No Developer ID Application identity was imported." >&2
            exit 1
          fi

          xcrun notarytool store-credentials "$POOL_NOTARY_PROFILE" \
            --key "$notary_key" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID"

          echo "POOL_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "POOL_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Install build tool
        run: brew install uv

      - name: Build signed and notarized application
        working-directory: pool
        run: sh desktop/build_mac_app.sh

      - name: Run Pool tests
        working-directory: pool
        run: .venv-desktop/bin/python -m unittest discover -s tests

      - name: Verify release artifact
        working-directory: pool
        shell: bash
        run: |
          set -euo pipefail
          test "$(plutil -extract CFBundleShortVersionString raw dist/Pool.app/Contents/Info.plist)" = "$REQUESTED_VERSION"
          codesign --verify --deep --strict dist/Pool.app
          xcrun stapler validate dist/Pool.app
          spctl --assess --type execute --verbose dist/Pool.app
          (cd dist && shasum -a 256 -c Pool-macOS-arm64.zip.sha256)

      - name: Publish signed Sparkle update
        working-directory: pool
        env:
          GH_TOKEN: ${{ github.token }}
          POOL_REQUIRE_NEW_RELEASE: "1"
          POOL_SPARKLE_PRIVATE_KEY: ${{ secrets.POOL_SPARKLE_PRIVATE_KEY }}
        run: sh desktop/publish_sparkle_release.sh "$REQUESTED_VERSION"

      - name: Record release
        shell: bash
        run: |
          {
            echo "## Pool $REQUESTED_VERSION published"
            echo
            echo "- Source: HerndonDryhurstStudio/Pool@${{ inputs.source_ref }}"
            echo "- Commit: $POOL_SOURCE_COMMIT"
            echo "- Feed: https://raw.githubusercontent.com/matdryhurst/HORUS-Releases/main/appcast.xml"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove ephemeral signing material
        if: always()
        shell: bash
        run: |
          if [[ -n "${POOL_SIGNING_KEYCHAIN:-}" && -f "$POOL_SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$POOL_SIGNING_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP"/pool-developer-id.p12 "$RUNNER_TEMP"/AuthKey_*.p8
