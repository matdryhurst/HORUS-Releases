name: Release Pool macOS

run-name: ${{ inputs.mode }} Pool ${{ inputs.version }} from ${{ inputs.source_ref }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from desktop/version.py, without a leading v
        required: true
        type: string
      source_ref:
        description: Pool branch, tag, or commit already reachable from main
        required: true
        default: main
        type: string
      mode:
        description: Validate signing without publishing, or publish an update
        required: true
        default: validate
        type: choice
        options:
          - validate
          - publish

permissions:
  contents: read

concurrency:
  group: pool-production-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.actor == 'matdryhurst' || github.actor == 'jordanmeyer')
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 120
    environment: pool-production
    env:
      POOL_NOTARY_PROFILE: pool-ci-notary
      REQUESTED_VERSION: ${{ inputs.version }}
      RELEASE_MODE: ${{ inputs.mode }}

    steps:
      - name: Create read-only Pool source token
        id: pool-source-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.POOL_SOURCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.POOL_SOURCE_APP_PRIVATE_KEY }}
          owner: HerndonDryhurstStudio
          repositories: Pool
          permission-contents: read

      - name: Check out private Pool source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HerndonDryhurstStudio/Pool
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          path: pool
          persist-credentials: false
          token: ${{ steps.pool-source-token.outputs.token }}

      - name: Validate release request
        working-directory: pool
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          [[ "$RELEASE_MODE" = validate || "$RELEASE_MODE" = publish ]]
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          actual_version="$(python3 - <<'PY'
          from desktop.version import APP_VERSION
          print(APP_VERSION)
          PY
          )"
          if [[ "$REQUESTED_VERSION" != "$actual_version" ]]; then
            echo "Requested $REQUESTED_VERSION but source declares $actual_version." >&2
            exit 1
          fi
          test -f "desktop/releases/$REQUESTED_VERSION.md"
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "The selected source is not reachable from Pool main." >&2
            exit 1
          fi
          echo "POOL_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: false

      - name: Run Pool tests before importing signing keys
        working-directory: pool
        run: |
          uv venv --python 3.12 .venv-desktop
          uv pip install --python .venv-desktop/bin/python -r requirements-desktop.txt
          .venv-desktop/bin/python -m unittest discover -s tests

      - name: Check protected credentials
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          POOL_SPARKLE_PRIVATE_KEY: ${{ secrets.POOL_SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          required=(
            APPLE_DEVELOPER_ID_P12_BASE64
            APPLE_DEVELOPER_ID_P12_PASSWORD
            APPLE_NOTARY_KEY_P8_BASE64
            APPLE_NOTARY_KEY_ID
            APPLE_NOTARY_ISSUER_ID
            POOL_SPARKLE_PRIVATE_KEY
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing pool-production secret: $name" >&2
              exit 1
            fi
          done

      - name: Prepare Developer ID and notarization
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/pool-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          security default-keychain -d user > "$RUNNER_TEMP/pool-original-keychain"
          echo "POOL_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          certificate="$RUNNER_TEMP/pool-developer-id.p12"
          notary_key="$RUNNER_TEMP/pool-notary.p8"

          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 -D > "$certificate"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 -D > "$notary_key"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"

          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk '/Developer ID Application/ {print $2; exit}')"
          if [[ -z "$identity" ]]; then
            echo "No Developer ID Application identity was imported." >&2
            exit 1
          fi

          xcrun notarytool store-credentials "$POOL_NOTARY_PROFILE" \
            --key "$notary_key" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID"

          echo "POOL_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build signed and notarized application
        working-directory: pool
        run: sh desktop/build_mac_app.sh

      - name: Verify release artifact
        id: verify
        working-directory: pool
        shell: bash
        run: |
          set -euo pipefail
          .venv-desktop/bin/python desktop/check_release_bundle.py dist/Pool.app
          codesign --verify --deep --strict dist/Pool.app
          xcrun stapler validate dist/Pool.app
          spctl --assess --type execute --verbose dist/Pool.app
          (cd dist && shasum -a 256 -c Pool-macOS-arm64.zip.sha256)

      - name: Validate or publish signed Sparkle update
        working-directory: pool
        env:
          GH_TOKEN: ${{ github.token }}
          POOL_SPARKLE_PRIVATE_KEY: ${{ secrets.POOL_SPARKLE_PRIVATE_KEY }}
        run: sh desktop/publish_sparkle_release.sh "--$RELEASE_MODE" "$REQUESTED_VERSION"

      - name: Keep exact publish bytes for interrupted-release recovery
        if: ${{ !cancelled() && inputs.mode == 'publish' && steps.verify.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Pool-${{ inputs.version }}-${{ github.run_id }}
          path: |
            pool/dist/Pool-macOS-arm64.zip
            pool/dist/Pool-macOS-arm64.zip.sha256
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

      - name: Record result
        shell: bash
        run: |
          {
            echo "## Pool $REQUESTED_VERSION: $RELEASE_MODE succeeded"
            echo
            echo "- Source: HerndonDryhurstStudio/Pool"
            echo "- Commit: $POOL_SOURCE_COMMIT"
            echo "- Feed: https://raw.githubusercontent.com/matdryhurst/HORUS-Releases/main/appcast.xml"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove ephemeral signing material
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/pool-original-keychain" ]]; then
            original_keychain="$(tr -d '\"' < "$RUNNER_TEMP/pool-original-keychain" | xargs)"
            security list-keychains -d user -s "$original_keychain" || echo "::warning::Could not restore Keychain search list"
            security default-keychain -d user -s "$original_keychain" || echo "::warning::Could not restore default Keychain"
          fi
          if [[ -n "${POOL_SIGNING_KEYCHAIN:-}" && -f "$POOL_SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$POOL_SIGNING_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP"/pool-developer-id.p12 "$RUNNER_TEMP"/pool-notary.p8 "$RUNNER_TEMP"/pool-original-keychain
